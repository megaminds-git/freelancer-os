name: Deploy Freelancer OS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # ── 1. Clone or pull latest code ──────────────────────────
            if [ ! -d "/root/freelancer-os/.git" ]; then
              rm -rf /root/freelancer-os
              git clone https://github.com/megaminds-git/freelancer-os.git /root/freelancer-os
            else
              cd /root/freelancer-os && git pull origin main
            fi

            cd /root/freelancer-os

            # ── 2. Restore .env files from server backups ─────────────
            cp /root/api.env.bak apps/api/.env
            cp /root/web.env.bak apps/web/.env
            cp /root/scraper.env.bak apps/scraper/.env

            # ── 3. Install Node dependencies ──────────────────────────
            pnpm install

            # ── 4. Generate Prisma client and run migrations ──────────
            cd apps/api && npx prisma generate && npx prisma migrate deploy && cd ../..

            # ── 5. Build web frontend ─────────────────────────────────
            pnpm --filter @freelancer-os/web build

            # ── 6. Set up Python venv for scraper ─────────────────────
            apt install python3.12-venv -y --quiet
            cd apps/scraper
            python3 -m venv venv --clear
            venv/bin/python -m pip install -r requirements.txt --quiet
            cd ../..

            # ── 7. Restart services with PM2 ──────────────────────────
            pm2 delete freelancer-api 2>/dev/null || true
            pm2 delete freelancer-scraper 2>/dev/null || true
            pm2 delete freelancer-web 2>/dev/null || true

            pm2 start "npx tsx apps/api/src/index.ts" --name freelancer-api
            pm2 start "apps/scraper/venv/bin/python apps/scraper/api.py" --name freelancer-scraper
            pm2 start "pnpm --filter @freelancer-os/web preview --host --port 5173" --name freelancer-web

            pm2 save
